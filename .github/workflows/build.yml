name: build-images

# Builds the two Docker images of the Hermes-Blender stack and pushes them to
# GHCR so CranL can deploy them as prebuilt images:
#
#   ghcr.io/roplizeramr-blip/hermes-blender-stack-blender-mcp:latest
#   ghcr.io/roplizeramr-blip/hermes-blender-stack-hermes:latest
#
# The repository is public, so GitHub-hosted runner minutes are free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: blender-mcp
            context: ./blender-mcp
            file: ./blender-mcp/Dockerfile
            description: "Blender 4.5.15 LTS headless + MCP server (39 tools)"
          - image: hermes
            # The Hermes image copies the shared skills/ folder, so its build
            # context is the repository root.
            context: .
            file: ./hermes/Dockerfile
            description: "Hermes AI Agent (WebUI + MCP client + 10 Blender skills)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            HERMES_STACK_VERSION=${{ github.sha }}

      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.description }}" >> "$GITHUB_STEP_SUMMARY"
          echo "context: \`${{ matrix.context }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
