# nginx front for the Blender MCP server.
# Public port 8080 -> uvicorn (127.0.0.1:8000).
# Streaming/SSE friendly: the MCP "streamable HTTP" transport keeps long-lived
# responses open, so buffering is disabled and timeouts are generous.

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75s;
    client_max_body_size 64m;

    access_log /dev/stdout;

    # WebSocket / SSE upgrade handling. Empty when the client sends no Upgrade
    # header, so plain HTTP requests are not forced to close the connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream blender_mcp {
        # Must match MCP_PORT in the Dockerfile (8000). The platform injects
        # PORT=8080 into the container for the public listener, so the MCP
        # server never uses the generic PORT variable.
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Long renders and SSE streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # Never buffer MCP responses (streams, big base64 images)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;

        # Landing page (static, no auth)
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        location = /favicon.ico {
            root /usr/share/nginx/html;
            access_log off;
            log_not_found off;
        }

        # Everything else: /health (open), /mcp (bearer token), /docs
        location / {
            proxy_pass http://blender_mcp;
        }
    }
}
